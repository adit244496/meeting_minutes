# Meeting Minutes - nginx site
#
# Install:
#   sudo cp deploy/nginx-meeting-minutes.conf /etc/nginx/sites-available/meeting-minutes
#   sudo ln -s /etc/nginx/sites-available/meeting-minutes /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS:
#   sudo certbot --nginx -d meetings.example.com
# certbot rewrites this file to add the 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name meetings.example.com;   # <-- change this

    # The frontend build output. Same origin as the API below, which is why
    # VITE_API_URL is empty at build time - no CORS, and the signed audio and
    # SSE URLs resolve without any host configuration.
    root /opt/meeting-minutes/frontend/dist;
    index index.html;

    # Meeting recordings are large. nginx defaults to 1 MB, which rejects
    # anything past about two minutes of audio - set this before wondering why
    # uploads fail with 413.
    client_max_body_size 500M;

    access_log /var/log/nginx/meeting-minutes.access.log;
    error_log  /var/log/nginx/meeting-minutes.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Job progress. Server-Sent Events break if nginx buffers them - the browser
    # sits on a blank progress bar until the whole stream closes.
    location /api/meetings/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long enough to hold an SSE stream open through a full transcription.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploading an hour of audio takes a while on a slow connection.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Nothing else should be reachable from outside.
    location ~ /\. {
        deny all;
    }
}
