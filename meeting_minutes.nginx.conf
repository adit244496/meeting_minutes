# Reverse proxy for Meeting Minutes.
#
# Unlike the hotel dashboard, this app does NOT serve its own frontend - the
# React app is built to static files and nginx serves them directly, proxying
# only /api to 127.0.0.1:8017. Same origin, so there is no CORS to configure
# and the signed audio links and progress stream resolve without extra setup.
#
#   sudo cp meeting_minutes.nginx.conf /etc/nginx/sites-available/meeting_minutes
#   sudo ln -s /etc/nginx/sites-available/meeting_minutes /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mom.ambujaneotia.com
#
# This file is deliberately HTTP-only. certbot reads server_name from this
# block, obtains the certificate, then rewrites the file to add the TLS server
# and the http->https redirect. Shipping a TLS block here instead would refer to
# certificate files that do not exist yet, and nginx -t fails on a missing
# certificate - so certbot could never run to create it.
#
# Do not add "http2 on;" by hand: that form needs nginx 1.25.1 or newer and is
# rejected outright by the 1.24 that Ubuntu 24.04 ships. On older nginx the
# equivalent is the http2 parameter on the listen directive, which certbot
# leaves alone; add it there if you want it.

server {
    listen 80;
    listen [::]:80;
    server_name mom.ambujaneotia.com;

    # The frontend build. Rebuild with `npm run build` after any frontend
    # change - nginx serves this directory straight from disk.
    root /home/srvadmin/meeting_minutes/meeting_minutes/frontend/dist;
    index index.html;

    # Meeting recordings, not spreadsheets. An hour of audio is 20-40 MB and
    # nginx defaults to 1 MB, which rejects anything past about two minutes.
    client_max_body_size 500M;

    access_log /var/log/nginx/meeting_minutes.access.log;
    error_log  /var/log/nginx/meeting_minutes.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Processing progress arrives as Server-Sent Events. nginx buffers proxied
    # responses by default, which holds the whole stream until the job finishes
    # - the user watches a progress bar that never moves, then jumps to done.
    # This block exists only to turn that off.
    location /api/meetings/ {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long enough to hold the stream open through a full transcription.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploading an hour of audio over a slow connection takes a while.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8017/health;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
