# Reverse proxy for Meeting Minutes.
#
# NOT needed for the initial IP deployment - the app serves its own frontend on
# port 8017, so http://<server-ip>:8017 works with no nginx at all. Use this to
# serve it on port 80/443, and once the app has a domain name and TLS.
#
# Like the hotel dashboard, nginx only forwards to 127.0.0.1:8017 - the app
# serves its own static files, so there is no root to configure here.
#
#   sudo cp meeting_minutes.nginx.conf /etc/nginx/sites-available/meeting_minutes
#   sudo ln -s /etc/nginx/sites-available/meeting_minutes /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mom.ambujaneotia.com
#
# This file is deliberately HTTP-only. certbot reads server_name from this
# block, obtains the certificate, then rewrites the file to add the TLS server
# and the http->https redirect. Shipping a TLS block here instead would refer to
# certificate files that do not exist yet, and nginx -t fails on a missing
# certificate - so certbot could never run to create it.
#
# Do not add "http2 on;" by hand: that form needs nginx 1.25.1 or newer and is
# rejected outright by the 1.24 that Ubuntu 24.04 ships. On older nginx the
# equivalent is the http2 parameter on the listen directive, which certbot
# leaves alone; add it there if you want it.

server {
    listen 80;
    listen [::]:80;
    server_name mom.ambujaneotia.com;   # or the bare IP until DNS exists

    # Meeting recordings, not spreadsheets: an hour of audio is 20-40 MB, and
    # nginx defaults to 1 MB, which rejects anything past about two minutes.
    client_max_body_size 500M;

    access_log /var/log/nginx/meeting_minutes.access.log;
    error_log  /var/log/nginx/meeting_minutes.error.log;

    # One location for the whole API, deliberately.
    #
    # An earlier version gave the SSE endpoint its own "location /api/meetings/"
    # block. That prefix does not match the bare "/api/meetings", so nginx
    # 301-ed to add the trailing slash while the app 307-ed to strip it, and the
    # request ping-ponged until the browser gave up with ERR_TOO_MANY_REDIRECTS.
    # "/api/" is a true prefix of every API path, so nothing is left to redirect.
    #
    # Buffering is off for all of it. It has to be off for the progress stream -
    # buffered Server-Sent Events leave the user watching a progress bar that
    # never moves - and the rest of the API returns small JSON that gains
    # nothing from buffering anyway.
    location /api/ {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Uploading an hour of audio over a slow connection takes a while, and
        # the progress stream stays open for the length of a transcription.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
